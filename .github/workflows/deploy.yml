# Deploys the frontend: develop → dev, test → test, main → prod (prod waits for
# approval in the GitHub environment). deploy/deploy-frontend.sh builds the
# commit with the Flutter version in pubspec.yaml and publishes it to the
# environment's Static Web App, with runtime_config.js and the IP restriction
# from the environment's Key Vault.
#
# Manual run (Actions → deploy → Run workflow): pick the environment's branch.
# The branch head is deployed again.
#
# The Azure identity trusts only this file from the environment's branch, so
# keep the file name. Resource names are environment secrets, not variables:
# GitHub masks secrets in every log line, and the logs of this public repo are
# public. Keep it that way: no set -x or --debug.

name: deploy

on:
  push:
    branches: [develop, test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'test' && 'test' || 'dev' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'test' && 'test' || 'dev' }}
    permissions:
      id-token: write
      contents: read
    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'test' && 'test' || 'dev' }}
      SUBSCRIPTION: ${{ secrets.SUBSCRIPTION }}
      RG: ${{ secrets.RG }}
      SWA: ${{ secrets.SWA }}
      KEYVAULT: ${{ secrets.KEYVAULT }}
    steps:
      # GitHub masks secrets case-sensitively, but Azure often returns resource
      # names in lower case. The mask commands themselves are not shown in the log.
      - name: Mask lower-case resource names
        run: |
          for value in "$SUBSCRIPTION" "$RG" "$SWA" "$KEYVAULT"; do
            lower=$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]')
            [ -z "$lower" ] || [ "$lower" = "$value" ] || echo "::add-mask::$lower"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version is environment.flutter in pubspec.yaml.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      # A failure here means the federated credential does not match: check the
      # repo and the environment name in the identity's federated credentials.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        run: deploy/deploy-frontend.sh "$ENVIRONMENT"
